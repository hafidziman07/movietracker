<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard — MovieTracker</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <div>
        <div class="brand">Movie<span class="gold">Tracker</span></div>
        <div class="brand-sub">Premium Experience</div>
      </div>
      <div class="user-card">
        <div class="avatar" id="sidebar-avatar">H</div>
        <div>
          <div class="name" id="hello">Halo...</div>
          <div class="mail" id="hello-mail">memuat…</div>
        </div>
      </div>
      <div class="side-label">Navigasi</div>
      <nav class="side-nav">
        <a href="dashboard.html" class="active">🏠 Dashboard</a>
        <a href="catalog.html">🎞️ Katalog Film</a>
        <a href="watchlist.html">🔖 Daftar Tonton</a>
      </nav>
      <div class="side-label">Komunitas</div>
      <nav class="side-nav">
        <a href="catalog.html">👥 Shared List</a>
        <a href="dashboard.html">⭐ Ulasan Saya</a>
      </nav>
      <div class="side-foot">
        <div class="conn">● Supabase Tersambung</div>
        <div class="premium-foot">Premium v2.0 <span style="color:var(--green)">●</span></div>
      </div>
    </aside>

    <main class="mainbar">
      <div class="page-head">
        <h1>Dashboard</h1>
        <span class="spacer"></span>
        <a href="catalog.html" class="btn outline">＋ Film Baru</a>
        <a href="watchlist.html" class="btn dash-btn">Tambah ke Watchlist</a>
        <button id="btn-logout" class="btn danger">⎋ Logout</button>
      </div>
      <div class="stats" id="stats"></div>
      <div class="two-col">
        <section class="panel">
          <h2>▶ Sedang Ditonton</h2>
          <div class="grid" id="watching"></div>
        </section>
        <section class="panel">
          <h2>🔄 Aktivitas Terbaru (real-time)</h2>
          <ul class="activity" id="recent-reviews"></ul>
        </section>
      </div>
    </main>
  </div>
  <script src="js/config.js"></script>
  <script type="module" src="js/pages/dashboard.js"></script>
</body>
</html>
