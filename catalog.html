<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Katalog — MovieTracker</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="dashboard.html">🎬 MovieTracker</a>
    <nav>
      <a href="dashboard.html">Dashboard</a>
      <a href="catalog.html" class="active">Katalog</a>
      <a href="watchlist.html">Watchlist</a>
      <button id="btn-logout" class="btn ghost">Keluar</button>
    </nav>
  </header>
  <main class="container">
    <div class="filters">
      <input id="q" type="search" placeholder="Cari judul...">
      <select id="genre"><option value="">Semua genre</option></select>
      <select id="sort">
        <option value="judul">Judul A-Z</option>
        <option value="tahun">Tahun terbaru</option>
        <option value="rating">Rating tertinggi</option>
      </select>
    </div>
    <div class="grid" id="grid"></div>
    <p id="info" class="muted"></p>
  </main>
  <script src="js/config.js"></script>
  <script type="module" src="js/pages/catalog.js"></script>
</body>
</html>
