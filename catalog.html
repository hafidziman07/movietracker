<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Katalog — MovieTracker</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <div>
        <div class="brand">Movie<span class="gold">Tracker</span></div>
        <div class="brand-sub">Premium Experience</div>
      </div>
      <div class="user-card">
        <div class="avatar" id="sidebar-avatar">M</div>
        <div><div class="name">Akun Saya</div><div class="mail">Supabase Auth</div></div>
      </div>
      <div class="side-label">Navigasi</div>
      <nav class="side-nav">
        <a href="dashboard.html">🏠 Dashboard</a>
        <a href="catalog.html" class="active">🎞️ Katalog Film</a>
        <a href="watchlist.html">🔖 Daftar Tonton</a>
      </nav>
      <div class="side-label">Komunitas</div>
      <nav class="side-nav">
        <a href="catalog.html">👥 Shared List</a>
        <a href="dashboard.html">⭐ Ulasan Saya</a>
      </nav>
      <div class="side-foot">
        <div class="conn">● Supabase Tersambung</div>
        <div class="premium-foot">Premium v2.0 <span style="color:var(--green)">●</span></div>
      </div>
    </aside>

    <main class="mainbar">
      <div class="page-head">
        <h1>Katalog Film</h1>
        <span class="spacer"></span>
        <button id="btn-logout" class="btn danger">⎋ Logout</button>
      </div>
      <div class="filters">
        <input id="q" type="search" placeholder="🔍 Cari judul...">
        <select id="genre"><option value="">Semua genre</option></select>
        <select id="sort">
          <option value="judul">Judul A-Z</option>
          <option value="tahun">Tahun terbaru</option>
          <option value="rating">Rating tertinggi</option>
        </select>
      </div>
      <div class="grid" id="grid"></div>
      <p id="info" class="muted" style="margin-top:20px"></p>
    </main>
  </div>
  <script src="js/config.js"></script>
  <script type="module" src="js/pages/catalog.js"></script>
</body>
</html>
